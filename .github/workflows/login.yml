name: Serv00 自动登录

on:
  workflow_dispatch:
  schedule:
    # 一月两次，避开整点（由于 GitHub Actions 排队机制，天然带有随机延迟）
    - cron: "43 5 11 * *"  
    - cron: "17 14 26 * *" 
  push:
    branches:
      - main

jobs:
  login:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout 仓库代码
        uses: actions/checkout@v6

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装 Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip xvfb libnss3 fonts-liberation
          python -m pip install --upgrade pip
          pip install selenium requests webdriver-manager chromedriver-binary-auto

      - name: 运行登录脚本
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
        run: python login_script.py

      - name: 上传截图
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login-screenshots
          path: "*.png"
          retention-days: 7

      - name: 更新 README 保活时间戳并提交
        if: always()
        run: |
          python -c "
          import re
          from datetime import datetime, timezone, timedelta

          bj_time = datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S')
          utc_time = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S')

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          pattern = r'<!-- KEEPALIVE_START -->.*?<!-- KEEPALIVE_END -->'
          replacement = f'<!-- KEEPALIVE_START -->\n> 🕒 **最后自动保活时间**：{bj_time} (UTC+8) / {utc_time} (UTC)\n<!-- KEEPALIVE_END -->'

          if re.search(pattern, content, flags=re.DOTALL):
              new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(new_content)
              print(f'✅ 已更新 README 时间戳: {bj_time} (UTC+8)')
          else:
              print('⚠️ 未找到保活锚点标记，跳过更新')
          "

          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status -s README.md) ]]; then
            git add README.md
            git commit -m "chore: update keepalive timestamp [skip ci]"
            git push
            echo "✅ 已成功提交并推送保活时间戳"
          else
            echo "ℹ️ README 无变化，跳过提交"
          fi

  keepalive-workflow:
    name: Keepalive Workflow
    needs: login
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
